name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --with pytest --with pyyaml python -m pytest -q
      - run: uv run --python 3.12 --with ruff ruff check .
